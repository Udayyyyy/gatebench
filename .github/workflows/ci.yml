name: checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.21'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: make check
      - run: uv build
      - run: uv run python scripts/reproduce.py --output runs/ci
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: gatebench-python-${{ matrix.python }}
          path: runs/ci
          if-no-files-found: ignore

  native-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.21'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra dev --extra tau
      - run: uv run pytest tests/test_tau_retail.py tests/test_study_verification.py
      - run: uv run gatebench tau-audit --output runs/native-ci
      - run: uv run gatebench verify-study docs/studies/real-models-v1
      - run: uv run gatebench verify-study docs/studies/tau2-retail-models-v1
      - run: uv run gatebench check-manifest docs/studies/real-models-v1
      - run: uv run gatebench check-manifest docs/studies/tau2-retail-models-v1
